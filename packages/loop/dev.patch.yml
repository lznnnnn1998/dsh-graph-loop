# Committed dev overlay TEMPLATE. scripts/e2e-*.sh materialize it via
# scripts/lib/dev-patch.sh, substituting __REPO_ROOT__ and __TMP_DIR__.
# Developer overlay: absolute-path plugins, no install. Apply with:
#   (materialized) dsh --profile web --patch <tmp>/dev.patch.yml --dump-config
- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  disabled: true

- insert:
    - id: graph-registry
      name: __REPO_ROOT__/packages/loop/src/registry.ts
      config:
        snapshotTtlMs: 0
    - id: graph-router
      name: __REPO_ROOT__/packages/loop/src/router.ts
    - id: graph-runtime
      name: __REPO_ROOT__/packages/loop/src/runtime.ts
      config:
        traceDir: __TMP_DIR__/dsh-graph-traces
    - id: graph-loop
      name: __REPO_ROOT__/packages/loop/src/index.ts
      config:
        maxParallelToolCalls: 10
        agents: []
        topology: dynamic


    - id: graph-ui
      name: __REPO_ROOT__/packages/graph-ui/src/index.ts
      config:
        provider: deepseek-official
        model: deepseek-flash

    - id: graph-tools
      name: __REPO_ROOT__/packages/loop/src/tools.ts
