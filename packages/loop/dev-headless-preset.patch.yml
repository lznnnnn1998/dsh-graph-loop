# Developer overlay for benchmark harnesses: keep the full preset tool set.
#   dsh --profile web --patch <abs>/packages/loop/dev-headless-preset.patch.yml --dump-config
- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  disabled: true

- insert:
    - id: graph-registry
      name: /Users/zhinan/Documents/dsh_workspace/dsh-graph-loop/packages/loop/src/registry.ts
      config:
        snapshotTtlMs: 0
    - id: graph-router
      name: /Users/zhinan/Documents/dsh_workspace/dsh-graph-loop/packages/loop/src/router.ts
    - id: graph-runtime
      name: /Users/zhinan/Documents/dsh_workspace/dsh-graph-loop/packages/loop/src/runtime.ts
      config:
        traceDir: /tmp/dsh-graph-traces
    - id: graph-loop
      name: /Users/zhinan/Documents/dsh_workspace/dsh-graph-loop/packages/loop/src/index.ts
      config:
        maxParallelToolCalls: 10
        agents: []
        topology: dynamic
        toolPolicy: preset
        # Benchmark arms opt back into the harness-specific retry guards.
        benchGuards: true



    - id: graph-tools
      name: /Users/zhinan/Documents/dsh_workspace/dsh-graph-loop/packages/loop/src/tools.ts
