# Committed dev overlay TEMPLATE. scripts/e2e-*.sh materialize it via
# scripts/lib/dev-patch.sh, substituting __REPO_ROOT__ and __TMP_DIR__.
# Developer overlay for scripts/e2e-subagents.sh: same as dev-headless.patch.yml
# but composition is off, so dynamic mode uses the legacy synthesizeTopology
# path that fans a research task out to parallel subagent nodes.
#   (materialized) dsh --profile headless --patch <tmp>
- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  disabled: true

- insert:
    - id: graph-registry
      name: __REPO_ROOT__/packages/loop/src/registry.ts
      config:
        snapshotTtlMs: 0
    - id: graph-router
      name: __REPO_ROOT__/packages/loop/src/router.ts
    - id: graph-runtime
      name: __REPO_ROOT__/packages/loop/src/runtime.ts
      config:
        traceDir: __TMP_DIR__/dsh-graph-traces
    - id: graph-loop
      name: __REPO_ROOT__/packages/loop/src/index.ts
      config:
        maxParallelToolCalls: 10
        agents: []
        topology: dynamic
        composition: false



    - id: graph-tools
      name: __REPO_ROOT__/packages/loop/src/tools.ts
