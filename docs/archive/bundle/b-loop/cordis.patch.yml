# @dsh/explore-loop — the graph driver replacing the stock agent loop.
#
# INSTALL THIS ONE IN A DEDICATED PROFILE. It changes every session in the profile:
# `ctx.agents.setFactory()` is exclusive, so exactly one loop may be registered
# (packages/core/agent/src/index.ts:383-392). Do not install this bundle and
# @dsh/explore-mode in the same profile: both insert graph-registry / graph-router /
# graph-runtime, and duplicated row ids are ambiguous to id-addressed patches
# (vendor/loader/src/config/tree.ts:51-73).
#
# WHY "disable + insert" AND NOT "rename in place"
#   A patch's `name` is a GUARD, not an override: the vendor include plugin warns and
#   skips a row whose `name` differs from the target's
#   (vendor/include/src/index.ts:115-117; behaviour is shared by mounting and
#   `dsh --dump-config`). So the stock row must be disabled and a new row inserted.
#
# ROW IDS PATCHED:
#   id: agent-loop   (packages/bundle/base/cordis.patch.yml:513) -> disabled: true
# ROWS INSERTED: graph-loop, graph-registry, graph-router, graph-runtime, graph-tools
#
# ORDER: inserted rows land at the end of the composed entry list. `graph-loop`
# declares the kernel services in its `inject`, so it activates when they arrive;
# row order therefore does not matter (a row waiting for a service stays mounted).

# ── 1. Turn the stock driver off. `name` is the guard. ─────────────────────────
- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  disabled: true
  # No `config:` here on purpose: omitting it keeps the row's composed config, and a
  # patch that supplied `config` would have to restate every key.

# ── 2. Graph kernel (host-scoped services) ─────────────────────────────────────
- insert:
    - id: graph-registry
      name: '@dsh/explore-loop/registry'
      config:
        document: !!js dshHomePath('graph/explore.graph.yaml')
        snapshotTtlMs: 5000
        includeMcpResources: true

    - id: graph-router
      name: '@dsh/explore-loop/router'
      config:
        confidenceThreshold: 0.55
        fallbackOnLowConfidence: true

    - id: graph-runtime
      name: '@dsh/explore-loop/runtime'
      config:
        # off | observe | shadow | active — starts in observe so a fresh install
        # cannot change behaviour before the graph has been inspected.
        mode: observe
        nodeExecutor: subagent
        maxReplans: 2
        budget:
          maxNodes: 12
          maxSteps: 40
          maxTokens: 250000
          maxWallMs: 900000

    # ── 3. The graph driver. This row is the AgentFactory. ─────────────────────
    - id: graph-loop
      name: '@dsh/explore-loop'
      config:
        # Keep the stock loop's volatile knob: a replacement card (or a retargeted
        # stock card) edits `maxParallelToolCalls` over the row id's settings
        # namespace (packages/core/agent-loop/src/index.ts:258,296; namespace =
        # profile entry id — packages/settings/settings/src/index.ts:302-330).
        maxParallelToolCalls: 10
        # Same declarative startup shape as the stock row, so overlays and
        # `apps/*` fixtures that configure `agents` keep a home.
        agents: []
        # Driver-specific: see graph-runtime above; the loop owns the run state.
        document: !!js dshHomePath('graph/explore.graph.yaml')
        mode: observe
        maxReplans: 2

    # Model-facing read/steer tools for the driver (host scope: every session in
    # this profile runs the graph driver).
    - id: graph-tools
      name: '@dsh/explore-loop/tools'
