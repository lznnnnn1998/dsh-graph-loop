# ---------------------------------------------------------------------------
# Edges. `provenance` decides how much the matcher may trust a weight.
# ---------------------------------------------------------------------------
edges:
  # --- artifact contracts (the strongest routing signal) ---
  - { id: e-glob-list, from: tool:glob, to: tool:grep, kind: produces, weight: 0.6, provenance: declared, evidence: { note: 'glob output narrows grep paths' } }
  - { id: e-grep-read, from: tool:grep, to: tool:read, kind: produces, weight: 0.9, provenance: measured, evidence: { observations: 412, statistic: 0.61, note: 'NPMI(grep,read) over 412 successful turns' } }
  - { id: e-read-edit-req, from: tool:read, to: tool:edit, kind: requires, weight: 1.0, provenance: declared, evidence: { note: 'fs-observation-policy: read-before-edit' } }
  - { id: e-edit-patch, from: tool:edit, to: tool:bash, kind: produces, weight: 0.7, provenance: measured, evidence: { observations: 301, statistic: 0.44 } }
  - { id: e-bash-test, from: tool:bash, to: tool:todo_write, kind: produces, weight: 0.3, provenance: schema-derived }
  - { id: e-present-deliver, from: tool:write, to: tool:present, kind: produces, weight: 0.5, provenance: declared }

  # --- substitution / conflict (what embedding cosine cannot express) ---
  - { id: e-bash-pwsh, from: tool:bash, to: tool:edit, kind: similar, weight: 0.22, provenance: embedding, symmetric: true, evidence: { note: 'descriptions overlap on "run/execute"; WRONG as a substitute signal' } }
  - { id: e-subagent-workflow, from: tool:subagent, to: tool:workflow, kind: substitutes, weight: 0.7, provenance: declared, symmetric: true, evidence: { note: 'both produce child.report; workflow fans out, subagent delegates one child' } }
  - { id: e-subagent-conflict, from: tool:subagent, to: tool:workflow, kind: conflicts, weight: 0.4, provenance: declared, symmetric: true, evidence: { note: 'nested fan-out when both are used in one node is wasteful, not illegal' } }
  - { id: e-run-code-conflict, from: tool:bash, to: tool:subagent, kind: conflicts, weight: 0.2, provenance: declared, symmetric: true, evidence: { note: 'PTC executor hides native declarations; a run_code node cannot also call bash' } }

  # --- permission gates ---
  - { id: e-bash-sandbox, from: tool:bash, to: tool:bash, kind: permission, weight: 1.0, provenance: declared, evidence: { note: 'ctx.sandboxPolicy + approval policy gate every bash call' } }

  # --- skill affinity ---
  - { id: e-skill-office, from: skill:dsh-office, to: tool:write, kind: produces, weight: 0.5, provenance: declared }
  - { id: e-skill-read, from: tool:skill, to: skill:dsh-office, kind: produces, weight: 0.8, provenance: declared }

# ---------------------------------------------------------------------------
# Template library — the `explore` preset's routing menu.
# Each template compiles to a TaskPlan; slots are filled by the matcher.
# ---------------------------------------------------------------------------
templates:
  - id: t_stock
    label: 'degenerate stock-equivalent graph (A/B control arm)'
    appliesTo: { intent: [code-question, code-review, code-change, bug-fix, test-failure, research, fact-finding, document, data-analysis, wide-research, multi-area-review, other] } # = every IntentClass
    toolUniverse: [read, write, edit, glob, grep, bash, todo_write, present, skill, ask_user_question, web_search, web_fetch, subagent, workflow]
    risk: 0.5
    gatePolicy: never
    slots: {}
    fixedNodes: # TaskTemplate.fixedNodes
      - { id: n_step, kind: agent-step, executor: step, instruction: 'Work toward the task; call tools as needed.' }
      - { id: n_end, kind: terminal, executor: step }
    fixedEdges:
      - { from: n_step, to: n_step, kind: control, when: { op: always } }
      - { from: n_step, to: n_end, kind: control, when: { op: fact, key: 'task.done', equals: true } }
    budget: { maxNodes: 2, maxSteps: 40, maxTokens: 400000, maxWallMs: 1800000, maxReplans: 2 }

  - id: t_code_investigate
    label: 'read-only codebase question'
    appliesTo: { intent: [code-question, code-review], artifactsIn: [path.locator], mutating: false }
    toolUniverse: [glob, grep, read, bash, todo_write]
    risk: 0.15
    gatePolicy: cold
    slots:
      discover: { choose: [glob, grep], scoreBy: artifactMatch }
      inspect: { choose: [read, bash], scoreBy: artifactMatch }
    budget: { maxNodes: 5, maxSteps: 12, maxTokens: 120000, maxWallMs: 300000, maxReplans: 1 }

  - id: t_code_edit_test
    label: 'investigate -> patch -> verify (the default coding path)'
    appliesTo: { intent: [code-change, bug-fix, test-failure], artifactsIn: [path.locator], mutating: true }
    toolUniverse: [read, edit, write, glob, grep, bash, todo_write, present]
    risk: 0.6
    gatePolicy: cold
    slots:
      discover: { choose: [grep, glob, read], scoreBy: artifactMatch }
      patch: { choose: [edit, write], scoreBy: successRate }
      verify: { choose: [bash], scoreBy: artifactMatch }
      report: { choose: [todo_write, present], scoreBy: intentMatch }
    budget: { maxNodes: 8, maxSteps: 20, maxTokens: 220000, maxWallMs: 900000, maxReplans: 3 }

  - id: t_research
    label: 'web research -> cited answer'
    appliesTo: { intent: [research, fact-finding], artifactsOut: [web.page], mutating: false }
    toolUniverse: [web_search, web_fetch, read, write, present]
    risk: 0.2
    gatePolicy: cold
    slots:
      search: { choose: [web_search], scoreBy: artifactMatch }
      read: { choose: [web_fetch, read], scoreBy: artifactMatch }
      synthesize: { choose: [write, present], scoreBy: intentMatch }
    budget: { maxNodes: 6, maxSteps: 16, maxTokens: 160000, maxWallMs: 600000, maxReplans: 2 }

  - id: t_doc_generate
    label: 'document generation through a skill'
    appliesTo: { intent: [document], artifactsOut: [file.binary, file.text], mutating: true }
    toolUniverse: [skill, read, write, present, bash]
    risk: 0.35
    gatePolicy: cold
    slots:
      loadSkill: { choose: [skill], scoreBy: intentMatch }
      draft: { choose: [write, read], scoreBy: artifactMatch }
      deliver: { choose: [present], scoreBy: intentMatch }
    budget: { maxNodes: 6, maxSteps: 14, maxTokens: 140000, maxWallMs: 600000, maxReplans: 2 }

  - id: t_data_analysis
    label: 'tabular analysis -> report'
    appliesTo: { intent: [data-analysis], artifactsIn: [file.text, path.locator], artifactsOut: [file.text] }
    toolUniverse: [read, bash, write, present, todo_write]
    risk: 0.4
    gatePolicy: cold
    slots:
      inspect: { choose: [read, bash], scoreBy: artifactMatch }
      compute: { choose: [bash], scoreBy: cost }
      report: { choose: [write, present], scoreBy: intentMatch }
    budget: { maxNodes: 7, maxSteps: 18, maxTokens: 180000, maxWallMs: 900000, maxReplans: 2 }

  - id: t_multi_agent_fanout
    label: 'parallel exploration by fresh subagents + join'
    appliesTo: { intent: [wide-research, multi-area-review], parallelizable: true }
    toolUniverse: [subagent, read, grep, glob, write, present]
    risk: 0.45
    gatePolicy: cold
    slots: {}
    fixedNodes:
      - { id: n_fan, kind: parallel, executor: step }
      - { id: n_join, kind: agent-step, executor: step, instruction: 'Merge the child reports into one answer.', toolAllow: [read, write, present] }
      - { id: n_end, kind: terminal, executor: step }
    # `branches` is template-authoring shorthand: the loader expands each branch into a
    # PlanNode with executor: subagent plus a fan-out edge from n_fan.
    branches:
      - { id: n_area_a, kind: tool-call, executor: subagent, capabilityId: tool:subagent, prompt: 'Review area A; return JSON {findings, risks}.' }
      - { id: n_area_b, kind: tool-call, executor: subagent, capabilityId: tool:subagent, prompt: 'Review area B; return JSON {findings, risks}.' }
    fixedEdges:
      - { from: n_fan, to: n_area_a, kind: control }
      - { from: n_fan, to: n_area_b, kind: control }
      - { from: n_area_a, to: n_join, kind: data }
      - { from: n_area_b, to: n_join, kind: data }
      - { from: n_join, to: n_end, kind: control }
    budget: { maxNodes: 6, maxSteps: 10, maxTokens: 200000, maxWallMs: 900000, maxReplans: 1 }

# ---------------------------------------------------------------------------
# A compiled plan (what kernel.compile() receives). Template instantiation for the
# task "the auth test fails after the refactor; fix it and prove it".
# ---------------------------------------------------------------------------
plans:
  - id: 'p_code_edit_test@3'
    templateId: t_code_edit_test
    version: 3
    compiledDigest: 'c41f0a9b7e2d5561'
    entry: n_discover
    terminals: [n_done]
    confidence: 0.82
    fallback: false
    gatePolicy: cold
    toolUniverse: [read, edit, write, glob, grep, bash, todo_write, present]
    budget: { maxNodes: 8, maxSteps: 20, maxTokens: 220000, maxWallMs: 900000, maxReplans: 3 }
    nodes:
      - id: n_discover
        kind: agent-step
        executor: step
        instruction: 'Locate the failing test and the code it exercises. Read before editing.'
        toolAllow: [glob, grep, read, bash]
        validate: 'artifacts:search.hits>=1'
        budget: { maxSteps: 4 }
      - id: n_patch
        kind: tool-call
        executor: step
        capabilityId: tool:edit
        instruction: 'Apply the smallest correct patch; keep unrelated files untouched.'
        toolAllow: [read, edit]
        validate: 'artifacts:file.patch>=1'
        idempotency: verify-before-retry
      - id: n_verify
        kind: tool-call
        executor: step
        capabilityId: tool:bash
        instruction: 'Run the failing test file, then the package suite if it passes.'
        toolAllow: [bash]
        validate: 'test.result.pass==true'
        model: { provider: deepseek, model: deepseek-v4-pro, reasoningEffort: high }
      - id: n_report
        kind: terminal
        executor: step
        instruction: 'Summarize the fix, the evidence, and the residual risk.'
        toolAllow: [todo_write, present]
    edges:
      - { from: n_discover, to: n_patch, kind: control, when: { op: artifact, type: search.hits } }
      - { from: n_discover, to: n_patch, kind: control, when: { op: noArtifact, type: search.hits } } # replan hint, guarded by budget
      - { from: n_patch, to: n_verify, kind: control, when: { op: artifact, type: file.patch } }
      - { from: n_verify, to: n_report, kind: control, when: { op: fact, key: 'test.result.pass', equals: true } }
      - { from: n_verify, to: n_patch, kind: control, when: { op: callFailed, tool: bash } } # bounded by maxReplans

# ---------------------------------------------------------------------------
# Matcher weights + thresholds (calibrated offline; versioned with the graph digest)
# ---------------------------------------------------------------------------
weights:
  version: 1
  terms: # sum = 1.0
    intentMatch: 0.26
    artifactMatch: 0.30
    toolAffinity: 0.16
    historySuccess: 0.12
    costPenalty: 0.10
    riskPenalty: 0.06
  confidence:
    absMin: 0.55 # below this: fallback plan
    marginMin: 0.08 # best - runner-up below this: fallback plan
  search:
    beamWidth: 8
    slotCandidates: 6
  cooccurrence:
    minObservations: 20
    shrinkageK: 10
    npmClamp: 0.0

usageNotes:
  - 'Namespace: when the plan is used as the loop graph, `toolUniverse` must equal the preset tool
     set minus tools the plan never needs; when the same plan is used as a preset template, the
     preset offers `toolUniverse` and the plan only narrows it softly.'
  - 'Never let two parallel branches write the same artifact without a join validator.'
  - 'Every mutating node needs a validator; the conformance suite refuses plans without one.'
