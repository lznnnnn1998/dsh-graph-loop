# example-graph.yaml — one graph document, two consumers (see design/graph-schema.ts).
#
# (1) The `explore` driver compiles `plans:` into the loop graph via design/kernel.ts.
# (2) The `explore` preset reads `templates:` as its template library: the preset owns
#     the tool universe + persona, the template owns the path a task takes through it.
#
# Tool names and schema sizes below are REAL: docs/tool-catalog.md (measured 2025-11,
# see design/measurements.md). Numbers marked `measured` come from that file; numbers
# marked `prior` are ESTIMATES until the token-economist's bench lands.
#
# Every relation here is either declared (curated), schema-derived, measured, or mined.
# Embedding similarity is deliberately absent from the routing path; see design/matching.ts.

